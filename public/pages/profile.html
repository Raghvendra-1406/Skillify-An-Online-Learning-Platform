<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile</title>
    <link rel="stylesheet" href="../css/profile.css">
</head>
<body>
    <header>
        <a href="index.html" style="text-decoration: none; color: inherit;">
			<h1>🎓Skillify</h1>
		</a>
        <nav>
            <a href="index.html">Home</a>
            <a href="courses.html">Courses</a>
            <a href="profile.html">Profile</a>
            <a href="about.html">About Us</a>
            <a href="contact.html">Contact</a>
            <a  href="#" id="logout-link">Logout</a>
        </nav>
    </header>
    
    <div class="container">
        <h2>User Profile</h2>
        <div class="profile-card">
            <img id="profile-picture" src="../images/profile.jpg" alt="Profile Picture">
            <p><strong>Name:</strong> <span id="username"></span></p>
            <p><strong>Email:</strong> <span id="email"></span></p>
            <p><strong>Date of Birth:</strong> <span id="dob"></span></p>
            <p><strong>Interests:</strong> <span id="interests"></span></p>
        </div>
    </div>

        <button id="showUpdateFormBtn">Update Profile</button>
        <div id="updateProfileSection" style="display: none;">
            <form id="updateProfileForm">
                <label>Name:</label>
                <input type="text" id="updateName" required>
        
                <label>Date of Birth:</label>
                <input type="date" id="updateDob" required>
        
                <label>Interests:</label>
                <input type="text" id="updateInterests">
        
                <h4>Change Password (optional)</h4>
                <label>Old Password:</label>
                <input type="password" id="oldPassword">
        
                <label>New Password:</label>
                <input type="password" id="newPassword">
        
                <label>Confirm New Password:</label>
                <input type="password" id="confirmPassword">
        
                <button type="submit">Save Changes</button>
            </form>
        </div>

    <script src="../js/profile.js"></script>
</body>
</html>
